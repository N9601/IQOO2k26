<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Truthbox mark: an eye rising from an open parcel.
       The box is the unboxing; the eye is the moment being witnessed. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fbf7f"/>
      <stop offset="1" stop-color="#1d6b43"/>
    </linearGradient>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="#121210"/>
  <rect x="9" y="9" width="110" height="110" rx="22" fill="url(#g)"/>

  <g filter="url(#rough)" stroke="#06170e" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 3D carton: two front faces meeting at the near vertical edge -->
    <path d="M32 62 L64 78 L64 108 L32 92 Z"/>
    <path d="M96 62 L64 78 L64 108 L96 92 Z"/>
    <!-- open top rim (the mouth of the parcel) -->
    <path d="M32 62 L64 50 L96 62 L64 74 Z"/>
    <!-- eye rising out of the opening: witnessed -->
    <path d="M40 44 Q64 26 88 44 Q64 58 40 44 Z" fill="#3aa870"/>
    <circle cx="64" cy="43" r="7" fill="#06170e" stroke="none"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Truthbox mark: an eye rising from an open box.
       The box is the unboxing; the eye is the moment being witnessed. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fbf7f"/>
      <stop offset="1" stop-color="#1d6b43"/>
    </linearGradient>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="#121210"/>
  <rect x="9" y="9" width="110" height="110" rx="22" fill="url(#g)"/>

  <g filter="url(#rough)" fill="none" stroke="#06170e" stroke-width="5.4"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- open box: front face + the two splayed-open flaps -->
    <path d="M40 78 L64 88 L88 78 L88 100 L64 110 L40 100 Z"/>
    <path d="M40 78 L28 68"/>
    <path d="M88 78 L100 68"/>
    <path d="M64 88 L64 110"/>
    <!-- eye rising out of the opening: witnessed -->
    <path d="M38 54 Q64 34 90 54 Q64 70 38 54 Z"/>
    <circle cx="64" cy="53" r="7.5" fill="#06170e" stroke="none"/>
  </g>
</svg>
